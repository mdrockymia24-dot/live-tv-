name: Auto Update Toffee M3U Playlist

on:
  schedule:
    # Runs every 20 minutes to guarantee fresh tokens before the 60-min expiration
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Toffee Playlist Generator
        run: |
          python fetch_toffee.py

      - name: Commit and Push Updated Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add toffee.m3u
          if git diff --staged --quiet; then
            echo "No changes in toffee.m3u, skipping commit."
          else
            git commit -m "Auto-update toffee.m3u playlist [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
